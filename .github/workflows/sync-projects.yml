name: Sync government records

# Calls the ingestion endpoint every 6 hours (IST 05:30, 11:30, 17:30, 23:30).
# Set repository secrets SITE_URL (e.g. https://hyderabad.properties) and CRON_SECRET.
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/sync-projects
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET not set, skipping."
            exit 0
          fi
          curl --fail-with-body -sS -m 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sync-projects"
